; PlatformIO project for the Waveshare ESP32-S3 1.54" e-Paper AIoT board
; Panel: 1.54" 200x200 mono B/W, SSD1681 controller (GxEPD2 class GxEPD2_154_D67)
;
; Open this folder in VS Code with the "PlatformIO IDE" extension, then use the
; PlatformIO toolbar: Build (✓), Upload (→), Serial Monitor (plug icon).

[env:waveshare-esp32s3-epaper]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Native USB-C is used for both flashing and the serial monitor ---
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial.print goes over the USB-C port
    -DBOARD_HAS_PSRAM
    -Isrc                         ; so UI code can use "ui/..." / "app/..." paths

; --- Module: ESP32-S3-PICO-1-N8R8 = 8 MB flash + 8 MB OCTAL (OPI) PSRAM ---
; This is the V2 board (V2 silkscreen top-left of the PCB / "V2" on the case
; back). V1 shipped an ESP32-S3FH4R2 instead: 4 MB flash, 2 MB QUAD PSRAM, for
; which qio_opi below would be WRONG. Waveshare phased V2 in from 2025-11-01
; and says example programs are not interchangeable between the two.
; The old comment here said "16 MB flash". It is 8.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; --- Cap parallel compile jobs (avoids a flaky "ar: No such file" race) ---
extra_scripts = pre:limit_jobs.py

; --- Display driver library ---
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    ; NimBLE, not Bluedroid: the S3 is BLE-only, and NimBLE is far smaller.
    ; Pinned to 1.x — the 2.x callback signatures changed.
    h2zero/NimBLE-Arduino@^1.4.2
