name: jota
description: Companion app for Jota, a pocket voice-note device. Pulls notes over BLE and transcribes them on the phone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# Versions are pinned exactly rather than caret-ranged. This app talks to a
# physical device over a hand-written binary protocol; a silent minor-version
# change in flutter_blue_plus is the kind of thing that turns into "sync stopped
# working" three months later. Bump deliberately, re-test against hardware.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- BLE ---------------------------------------------------------------
  # The only BLE package with maintained background support on both platforms
  # and a stream API that does not swallow notification ordering.
  flutter_blue_plus: 1.35.5

  # --- Storage -----------------------------------------------------------
  # sqflite over drift: see README. Two tables, no codegen step.
  sqflite: 2.4.1
  # 1.9.1, not 1.9.0: the Flutter SDK's flutter_test pins path to 1.9.1, so the
  # exact 1.9.0 pin no longer resolves. A patch bump, SDK-required.
  # Ranged, not pinned, unlike its neighbours: flutter_test pins `path` exactly,
  # and which version it pins moves with the Flutter SDK. An exact pin here
  # therefore builds on whichever machine matches and fails on the other.
  path: ^1.9.0
  path_provider: 2.1.5
  # API key only. Never in SharedPreferences.
  flutter_secure_storage: 9.2.4
  # Non-secret preferences (device id, autosync flag, model name).
  shared_preferences: 2.3.3

  # --- Network -----------------------------------------------------------
  # Multipart upload to Whisper. dio would also work; http is one dependency
  # lighter and this app makes exactly one kind of request.
  http: 1.2.2

  # --- Audio -------------------------------------------------------------
  # Plays the decoded WAV from a file path on both platforms.
  just_audio: 0.9.42

  # --- Background --------------------------------------------------------
  # Android foreground service that keeps a Dart isolate alive so the BLE
  # scan can survive the app leaving the foreground. iOS needs none of this —
  # see README, "Background sync, honestly".
  flutter_foreground_task: 8.10.4

  # --- Security ----------------------------------------------------------
  # The app lock (Settings ▸ Privacy). Face ID / Touch ID / fingerprint with
  # the device passcode as fallback — the OS owns the credential, we never
  # store a secret. Needs FlutterFragmentActivity on Android (see MainActivity)
  # and NSFaceIDUsageDescription on iOS.
  local_auth: 2.3.0

  # --- Misc --------------------------------------------------------------
  intl: ^0.20.2
  provider: 6.1.2
  # Minimal hairline line-icons (Feather's successor), drop-in IconData. Used in
  # the bottom nav and for back/add/edit throughout. Pinned exact.
  lucide_icons_flutter: 3.1.15
  whisper_ggml: ^2.6.0
  share_plus: ^12.0.2
  # The corrections export is a zip of WAVs plus a manifest. Pure Dart.
  archive: ^3.6.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  generate: true

  # ONE family, four scripts: IBM Plex. Serif for headlines and the wordmark,
  # Sans for labels and prose, Mono for every figure, and Sans Arabic for
  # Arabic note text.
  #
  # Arabic is why Plex won rather than a nicer-looking pairing. Fraunces and
  # Inter carry NO Arabic glyphs at all, so roughly half the notes were falling
  # back to whatever face the phone happened to have — a different design on
  # every handset, inside the one screen that matters most. Plex Arabic is
  # drawn by the same team on the same skeleton, so the two languages finally
  # read as one product.
  #
  # All STATIC instances (Sans baked from the variable original with
  # fonttools) — iOS/CoreText did not load the variable files — and each
  # family name matches the font's internal name, which is what iOS resolves.
  fonts:
    - family: IBM Plex Serif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Regular.ttf
          weight: 400
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
