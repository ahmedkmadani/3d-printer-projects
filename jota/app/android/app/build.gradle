plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "dev.jota.jota"
    compileSdk = flutter.compileSdkVersion
    // Pinned, not flutter.ndkVersion. whisper_ggml builds its native
    // whisper.cpp against NDK 29 and every other plugin against 27; Flutter's
    // default of 28.2 satisfies neither, and the rule is "use the highest,
    // they are backward compatible".
    ndkVersion = "29.0.13113456"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "dev.jota.jota"

        // 23, not Flutter's default 21. Two reasons, both about BLE:
        //   * requestMtu / the 247-byte MTU negotiation the transfer relies on
        //     is only dependable from 23 onward;
        //   * below 23 the runtime-permission model does not exist, so the
        //     Bluetooth permission flow would need a second code path for a
        //     vanishingly small install base.
        minSdkVersion = flutter.minSdkVersion

        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
